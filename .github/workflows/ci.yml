name: CI

# 기본 브랜치 push와 모든 PR에서 실행.
on:
  push:
    branches: [main]
  pull_request:

# 최소 권한(코드 읽기만).
permissions:
  contents: read

# 같은 브랜치에 새 푸시가 오면 진행 중인 이전 실행은 취소(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 외부 인프라·무거운 로컬 모델이 필요한 테스트는 마커로 제외한다.
      #   llm: 실제 LLM 호출 / ml: 무거운 모델 로드 / mcp: stdio 서브프로세스 / pg: 실 PostgreSQL
#   legacy_data: 압축 격리한 커머스 데이터셋이 있어야 도는 것 (되살리면 레거시 의존성이 생긴다)
      # 나머지 결정론 테스트는 외부 의존 없이 깨끗한 러너에서 그대로 통과해야 한다.
      - name: Run tests
        run: pytest -q -m "not llm and not ml and not mcp and not pg and not legacy_data"
