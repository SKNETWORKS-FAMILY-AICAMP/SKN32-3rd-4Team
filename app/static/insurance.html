<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올바른 보험비서</title>
<!--
  스토리보드 컷①~⑧ 의 사람 화면.

  ★이 화면이 지켜야 하는 것

    · 기권을 **실패처럼 보이지 않게** 한다. "확인 불가"는 정상 결과다
    · 경고를 **접거나 흐리지 않는다**. warnings[] 는 항상 펼쳐 보인다
    · 코호트의 실제/합성을 **다른 구역**에 그린다. 색만 다르게 하지 않는다
    · **판정 가능 약관이 0건이면 그 사실을 첫 화면에 쓴다**
-->
<style>
  :root{
    --bg:#fbfbfa; --fg:#1a1a18; --muted:#6b6b66; --line:#e3e2dd;
    --card:#fff; --accent:#2f5d50; --warn:#8a5a00; --warnbg:#fff8e6;
    --danger:#9a2a2a; --dangerbg:#fdf1f1; --ok:#1f5c3d; --okbg:#f0f7f2;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181a; --fg:#e9e8e4; --muted:#9b9a94; --line:#2c2f33;
      --card:#1d2023; --accent:#7fc0ac; --warn:#e0b25e; --warnbg:#2b2416;
      --danger:#e58c8c; --dangerbg:#2c1b1b; --ok:#8fd0ab; --okbg:#16261e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.65 -apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:1.5rem;margin:0 0 4px}
  h2{font-size:1.05rem;margin:0 0 12px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin:0 0 18px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1 1 180px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:0 0 4px}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg);color:var(--fg);font-size:1rem}
  button{padding:10px 18px;border:0;border-radius:8px;background:var(--accent);
    color:#fff;font-size:1rem;cursor:pointer}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .banner{border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:.92rem}
  .banner.warn{background:var(--warnbg);color:var(--warn);border:1px solid currentColor}
  .banner.danger{background:var(--dangerbg);color:var(--danger);border:1px solid currentColor}
  .banner.ok{background:var(--okbg);color:var(--ok);border:1px solid currentColor}
  .verdict{font-size:1.25rem;font-weight:600;margin:0 0 6px}
  .cite{border-left:3px solid var(--accent);padding:8px 0 8px 12px;margin:10px 0;
    font-size:.92rem}
  .cite .loc{color:var(--muted);font-size:.8rem;font-family:ui-monospace,monospace}
  .quote{white-space:pre-wrap;word-break:break-word}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0}
  .muted{color:var(--muted)}
  .small{font-size:.85rem}
  .chip{display:inline-block;padding:2px 9px;border:1px solid var(--line);
    border-radius:999px;font-size:.78rem;margin:0 6px 6px 0}
  .split{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:760px){.split{grid-template-columns:1fr 1fr}}
  .demo{border-style:dashed}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:10px;overflow-x:auto;font-size:.8rem;margin:8px 0 0}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <h1>올바른 보험비서</h1>
  <p class="sub">진료비 내역서의 질병기호와 약관을 대조해 <strong>보장 여부를 미리</strong> 확인합니다.</p>

  <!-- 컷① 지원범위 선언 -->
  <section class="card" id="scope">
    <h2>지금 답할 수 있는 범위</h2>
    <div id="scopeBody" class="muted small">불러오는 중…</div>
  </section>

  <!-- 컷②~⑤ 판정 -->
  <section class="card">
    <h2>보장 여부 확인</h2>
    <div class="row">
      <div>
        <label for="insurer">보험사</label>
        <input id="insurer" list="insurers" placeholder="예: DB손해보험" autocomplete="off">
        <datalist id="insurers"></datalist>
      </div>
      <div>
        <label for="enrolled">가입일 (YYYYMMDD)</label>
        <input id="enrolled" placeholder="20200101" inputmode="numeric" autocomplete="off">
      </div>
      <div>
        <label for="codes">질병기호 (쉼표로 구분)</label>
        <input id="codes" placeholder="F32, S82" autocomplete="off">
      </div>
    </div>

    <!-- ★컷② 사용자 승인. 추출한 코드를 확인 없이 판정에 쓰지 않는다. -->
    <p class="small" style="margin:14px 0 6px">
      <label style="display:flex;gap:8px;align-items:flex-start;color:var(--fg)">
        <input type="checkbox" id="consent" style="width:auto;margin-top:4px">
        <span>위 질병기호가 제 진료 기록과 맞다는 것을 확인했습니다.
          <span class="muted">(확인하지 않은 기호로는 판정하지 않습니다)</span></span>
      </label>
    </p>

    <button id="go" disabled>판정하기</button>
    <span id="status" class="small muted" style="margin-left:10px"></span>
  </section>

  <div id="result"></div>

  <!-- 용어 설명 -->
  <section class="card">
    <h2>약관 용어 찾아보기</h2>
    <div class="row">
      <div><label for="term">용어</label>
        <input id="term" placeholder="예: 도수치료" autocomplete="off"></div>
      <div style="flex:0 0 auto;align-self:end">
        <button class="ghost" id="termGo">약관에서 찾기</button></div>
    </div>
    <div id="termOut"></div>
  </section>

  <!-- 컷⑧ 코호트 — ★실제와 합성을 다른 구역에 그린다 -->
  <section>
    <h2 style="margin:26px 0 12px">비슷한 사례의 청구 결과</h2>
    <div class="split">
      <div class="card" id="cohortReal">
        <h2>실제 검증 데이터</h2>
        <div class="muted small">질병기호를 넣고 판정하면 함께 조회합니다.</div>
      </div>
      <div class="card demo" id="cohortDemo">
        <h2>DEMO · 합성 데이터</h2>
        <div class="muted small">시연용입니다. 실제 지급 통계가 아닙니다.</div>
      </div>
    </div>
  </section>

  <p class="small muted" style="margin-top:34px">
    이 화면은 참고용 사전 안내입니다. 최종 지급 여부는 보험사의 심사로 결정됩니다.
  </p>
</div>

<script src="/static/insurance.js"></script>
</body>
</html>
